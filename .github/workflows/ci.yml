name: Checks

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LLVM
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clang llvm
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install llvm
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          fi

      - name: Run tests
        run: pytest

  llvm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        llvm: [14, 16, 18, 19, 20, 21, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          python-version: "3.14"
      - name: Install LLVM ${{ matrix.llvm }}
        run: |
          llvm=${{ matrix.llvm }}
          sudo apt-get update
          if ! sudo apt-get install -y "clang-$llvm" "llvm-$llvm"; then
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh "$llvm"
          fi
          echo "/usr/lib/llvm-$llvm/bin" >> "$GITHUB_PATH"
      - name: Run llvm-cov tests
        run: pytest -v


  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          python-version: "3.14"

      - name: Run ruff check
        run: ruff check .
  
  mypy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run mypy
        run: mypy --strict .

  build_for_publish:
    name: Build distribution
    if: github.event_name == 'push'
    needs: [test, ruff, mypy, llvm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install pypa/build
        run: python3 -m pip install build --user
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build_for_publish]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/differential-coverage
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
